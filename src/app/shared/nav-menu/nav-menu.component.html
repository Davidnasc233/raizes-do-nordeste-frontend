@if (currentRoute !== 'cart') {
  <nav class="nav-container my-0">
  <div class="d-flex align-items-center justify-content-between items">
    <div class="d-flex align-items-center">
      <button class="d-flex flex-column align-items-center" (click)="selectButton('home')">
        <i class="fa-solid fa-house secondary" [class.active]="isSelected === 'home'"></i>
        <span class="secondary mt-1" [class.active]="isSelected === 'home'">Ínicio</span>
      </button>
    </div>
    <div class="cart-container d-flex align-items-center gap-2">
      <span class="count text-white">
        <small>
        {{ countCart }}
      </small>
    </span>
      <button class="d-flex flex-column align-items-center" (click)="selectButton('cart')">
        <i class="fa-solid fa-cart-shopping secondary" [class.active]="isSelected === 'cart'"></i>
        <span class="secondary mt-1" [class.active]="isSelected === 'cart'">Carrinho</span>
      </button>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="d-flex flex-column align-items-center" (click)="selectButton('user-profile')">
        <i class="fa-solid fa-user secondary" [class.active]="isSelected === 'user-profile'"></i>
        <span class="secondary mt-1" [class.active]="isSelected === 'user-profile'">Conta</span>
      </button>
    </div>

  </div>
</nav>
} @else {

}
