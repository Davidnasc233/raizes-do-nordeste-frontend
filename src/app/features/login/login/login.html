<div class="d-flex flex-column justify-content-center px-4">
  <section>
    <span class="color-muted">
      Acesse para acompanhar pedidos, acumular pontos e receber promoções da sua unidade.
    </span>
  </section>

  <section class="d-flex flex-column gap-3 mt-3">
    <input type="text" class="border-disabled color-muted py-2 px-3 rounded-main" placeholder="E-mail" />
    <input type="password" class="border-disabled color-muted py-2 px-3 rounded-main" placeholder="Senha"/>
    <button class="bg-primary-red rounded-main text-white p-2">Entrar</button>
    <div class="d-flex justify-content-center">
      <span class="primary"> <strong>Não tem conta? cadastre-se</strong> </span>
    </div>
  </section>

  <section class="security mt-3">
    <div class="d-flex align-items-center gateway-container gap-2 bg-secondary-bege py-3 px-3">
      <i class="fa-solid fa-shield-halved text-success"></i>
      <span class="gateway color-muted ps-2">
        Seus dados são tratados conforme a LGPD. Coletamos apenas o necessário e você pode solicitar
        exclusão a qualquer momento em Conta > Privacidade.
      </span>
    </div>
  </section>
</div>
