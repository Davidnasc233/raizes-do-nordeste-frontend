<main class="payment">
    <section class="container-payment">
        <div>
            <div class="subtotal d-flex flex-column gap-2 pb-2">
                <div class="d-flex justify-content-between">
                    <span>
                        Subtotal
                    </span>
                    <span>
                        R$ 42,90
                    </span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted">
                        Entrega
                    </span>
                    <span class="text-muted">
                        R$ 7,90
                    </span>
                </div>
            </div>

            <div class="pt-2 d-flex justify-content-between">
                <span>
                    <strong>
                        Total
                    </strong>
                </span>
                <span class="primary">
                    <strong>
                        R$ 50,80
                    </strong>
                </span>
            </div>
        </div>
    </section>

    <section class="security mt-3">
        <div class="d-flex align-items-center gateway-container gap-2 bg-secondary-bege py-2 px-3">
            <i class="fa-solid fa-shield-halved text-success"></i>
            <span class="gateway ps-2">
                Pagamento processado por gateway externo seguro. Os dados do cartão não são armazenados pelo app (PCI-DSS).
            </span>
        </div>
    </section>

    <section class="btn-section px-2 py-3">
        <div class="d-flex gap-3">
            <button class="d-flex align-items-center justify-content-center btn btn-simulate btn-custom bg-secondary-bege">
                <span class="simulate color-custom">
                    <strong>
                        Simular recusa
                    </strong>
                </span>
            </button>
            <button class="d-flex align-items-center justify-content-center gap-1 btn-pay btn btn-custom bg-primary-red secondary">
                <i class="fa-regular fa-credit-card"></i>
                <span class="pay">
                    <strong>
                        Pagar R$ 50,80
                    </strong>
                </span>
            </button>
        </div>
    </section>
</main>
