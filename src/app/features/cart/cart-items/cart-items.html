@for (item of data; track item.id) {
<div class="background my-2">

    <div class="d-flex">
        <div class="image">
            <img src="{{item.image}}" alt="dishes">
        </div>


        <div class="resume ps-2 d-flex align-items-center justify-content-between ms-2 w-100">

            <div class="d-flex flex-column">
                <p class="m-0 color-custom fs-5">
                    <strong>
                        {{ item.name }}
                    </strong>
                </p>

                <div class="d-flex">
                    <div>
                        <p class="primary m-0">
                            <strong>{{ item.price | currency: 'BRL'}}</strong>
                        </p>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-end">

                <div class="quantity-container d-flex align-items-center justify-content-center">
                    <button class="custom-button bg-secondary-bege">
                        <i class="fa-solid color-custom fa-minus"></i>
                    </button>
                    <p class="m-0 q-number">
                        {{ item.quantity }}
                    </p>
                    <button class="custom-button bg-primary-red">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

        </div>

    </div>
</div>

<div class="mb-2">
    <button>
        <i class="fa-solid fa-trash text-muted"></i>
        <small class="ps-1 text-muted">Limpar carrinho</small>
    </button>
</div>
}
