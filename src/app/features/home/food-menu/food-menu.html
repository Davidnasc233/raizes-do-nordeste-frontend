<div class="d-flex flex-row justify-content-between overflow">
    @for (option of selectOptions; track option.value) {
    <button (click)="selectOption(option.value)" class="custom-button me-1"
        [class.active]="selectedCategory === option.value">
        <span><strong>{{ option.name }}</strong></span>
    </button>
    }
</div>

<div>
    <p class="text-uppercase font-weight-bold color-custom mt-3 mb-0">
        <strong>
            <span>Cardápio</span> - {{ countItems }} itens
        </strong>
    </p>
</div>
