<div class="carousel-container d-flex justify-content-center" (mouseenter)="stopAutoPlay()"
  (mouseleave)="startAutoPlay()">
  <div class="carousel-inner">
    @for (slide of slides; track $index) {
    <div class="carousel-item" [class.active]="$index === currentIndex">
      <img [src]="slide.image" [alt]="slide.title" class="carousel-image" />
    </div>
    }
  </div>

  <button class="control-btn prev" (click)="prevSlide()">&#10094;</button>
  <button class="control-btn next" (click)="nextSlide()">&#10095;</button>

  <div class="carousel-dots">
    @for (slide of slides; track $index) {
    <span [class.active]="$index === currentIndex" (click)="goToSlide($index)">
    </span>
    }
  </div>
</div>
